<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento de tu pedido | MUSIÚ</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #101010; color: #fff; font-family: Arial, sans-serif; }
.contenedor { max-width: 460px; margin: auto; padding: 25px 22px 45px; }
.logo { width: 180px; height: 180px; border: 2px solid #d6b46a; border-radius: 50%; margin: 0 auto 35px; display: flex; align-items: center; justify-content: center; flex-direction: column; }
.logo h1 { color: #f5e5c8; font-size: 43px; margin: 0; letter-spacing: -2px; }
.logo .linea { background: #d6b46a; width: 110px; height: 4px; transform: rotate(-5deg); }
.logo small { color: #d6b46a; font-size: 8px; margin-top: 13px; }
.centro { text-align: center; }
.subtitulo { color: #d6b46a; font-size: 14px; font-weight: bold; }
.numero { font-size: 36px; margin: 22px 0; }
.estado-actual { font-size: 25px; color: #d6b46a; margin-bottom: 16px; }
.descripcion { color: #bbb; font-size: 15px; line-height: 1.5; }
.separador { border: 0; border-top: 1px solid #514737; margin: 35px 0; }
.paso { display: flex; align-items: center; gap: 18px; margin-bottom: 35px; }
.icono { width: 56px; height: 56px; flex-shrink: 0; border-radius: 50%; background: #292929; color: #aaa; display: flex; align-items: center; justify-content: center; font-size: 25px; }
.icono svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.paso.activo .icono { background: #d6b46a; color: #101010; }
.nombre { font-size: 20px; font-weight: bold; color: #999; }
.paso.activo .nombre { color: #d6b46a; }
</style>
</head>
<body>
<div class="contenedor">
  <div class="logo">
    <h1>MUSIÚ</h1>
    <div class="linea"></div>
    <small>MÁS QUE PIZZA, UNA EXPERIENCIA</small>
  </div>
  <div class="centro">
    <div class="subtitulo">SEGUIMIENTO DE TU EXPERIENCIA</div>
    <h1 class="numero" id="numero">Pedido #123</h1>
    <h2 class="estado-actual" id="estadoActual"></h2>
    <p class="descripcion" id="descripcionActual"></p>
  </div>
  <hr class="separador">
  <div id="pasos"></div>
</div>
<script>
// Dibujos vectoriales: se muestran igual en Android, iPhone y computadores.
const iconos = {
  recibido: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4.5h6M9 3h6v3H9zM8.5 13l2.5 2.5 4.5-5"/>',
  preparacion: '<path d="M4 11h16v5a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4v-5zM2 11h20M8 3c-2 2 2 3 0 5M13 3c-2 2 2 3 0 5M18 3c-2 2 2 3 0 5"/>',
  listo: '<path d="M3 8l9-5 9 5v10l-9 5-9-5zM3 8l9 5 9-5M12 13v10M8 5.8l9 5"/><path d="M15 16l2 2 4-4"/>',
  en_camino: '<circle cx="5.5" cy="18" r="2.5"/><circle cx="18.5" cy="18" r="2.5"/><path d="M8 18h4l2-6h4l2 3M12 18l-3-7H5M14 12l-2-3h-2M16 9h3l2 3"/>',
  entregado: '<path d="M3 11.5L12 4l9 7.5V21H3zM9 21v-7h6v7"/><path d="M16 15.5l2 2 4-4"/>'
};

const estados = [
  { clave: "recibido", titulo: "Pedido confirmado", descripcion: "¡Recibimos tu pedido! Pronto comenzaremos a prepararlo." },
  { clave: "preparacion", titulo: "Preparando tu pedido", descripcion: "Estamos preparando tu pedido con mucho cuidado." },
  { clave: "listo", titulo: "Pedido listo para entregar", descripcion: "¡Tu pedido está listo para salir!" },
  { clave: "en_camino", titulo: "Tu pedido va en camino", descripcion: "¡Ya salió de MUSIÚ y va rumbo a ti!" },
  { clave: "entregado", titulo: "Pedido entregado", descripcion: "¡Buen provecho! Gracias por elegir MUSIÚ." }
];

const SUPABASE_URL = "https://zvruieqqzknljoylrhjp.supabase.co";
const SUPABASE_KEY = "sb_publishable_zRoz-osrAzL8khVnatcbKw_Zrcz5Tw7";

async function consultarPedido() {
  const parametros = new URLSearchParams(window.location.search);
  const codigo = parametros.get("codigo");
  if (!codigo) {
    document.getElementById("estadoActual").textContent = "Código de seguimiento no encontrado";
    document.getElementById("descripcionActual").textContent = "Abre el enlace que recibiste por WhatsApp.";
    document.getElementById("pasos").replaceChildren();
    document.getElementById("numero").textContent = "MUSIÚ";
    return;
  }
  try {
    const respuesta = await fetch(`${SUPABASE_URL}/rest/v1/rpc/consultar_seguimiento_cliente`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": SUPABASE_KEY },
      body: JSON.stringify({ p_codigo: codigo })
    });
    if (!respuesta.ok) throw new Error(`Error HTTP ${respuesta.status}`);
    const datos = await respuesta.json();
    if (!Array.isArray(datos) || datos.length === 0) throw new Error("Pedido no encontrado");
    const pedido = datos[0];
    document.getElementById("numero").textContent = `Pedido #${pedido.numero_pedido}`;
    if (pedido.estado === "cancelado") {
      document.getElementById("estadoActual").textContent = "Pedido cancelado";
      document.getElementById("descripcionActual").textContent = "Comunícate con MUSIÚ si necesitas ayuda.";
      document.getElementById("pasos").replaceChildren();
      return;
    }
    mostrarSeguimiento(pedido.estado);
  } catch (error) {
    document.getElementById("estadoActual").textContent = "No pudimos consultar tu pedido";
    document.getElementById("descripcionActual").textContent = "Verifica tu enlace e intenta nuevamente.";
    document.getElementById("pasos").replaceChildren();
    console.error(error);
  }
}
consultarPedido();
setInterval(consultarPedido, 15000);

function mostrarSeguimiento(estado) {
  const indice = estados.findIndex(e => e.clave === estado);
  const actual = estados[indice];
  if (!actual) {
    document.getElementById("estadoActual").textContent = "Estado no disponible";
    document.getElementById("descripcionActual").textContent = "";
    document.getElementById("pasos").replaceChildren();
    return;
  }
  document.getElementById("estadoActual").textContent = actual.titulo;
  document.getElementById("descripcionActual").textContent = actual.descripcion;
  const contenedor = document.getElementById("pasos");
  contenedor.replaceChildren();
  estados.forEach((paso, i) => {
    const fila = document.createElement("div");
    fila.className = "paso" + (i <= indice ? " activo" : "");
    const icono = document.createElement("div");
    icono.className = "icono";
    const svgNS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("aria-hidden", "true");
    svg.innerHTML = iconos[paso.clave];
    icono.appendChild(svg);
    const nombre = document.createElement("div");
    nombre.className = "nombre";
    nombre.textContent = paso.titulo;
    fila.append(icono, nombre);
    contenedor.appendChild(fila);
  });
}
</script>
</body>
</html>
