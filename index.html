<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101010">
<title>Seguimiento de tu pedido | MUSIÚ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101010;color:#fff;font-family:Arial,sans-serif}.contenedor{max-width:460px;margin:auto;padding:25px 22px 45px}.logo{width:180px;height:180px;border:2px solid #d6b46a;border-radius:50%;margin:0 auto 35px;display:flex;align-items:center;justify-content:center;flex-direction:column}.logo h1{color:#f5e5c8;font-size:43px;margin:0;letter-spacing:-2px}.logo .linea{background:#d6b46a;width:110px;height:4px;transform:rotate(-5deg)}.logo small{color:#d6b46a;font-size:8px;margin-top:13px}.centro{text-align:center}.subtitulo{color:#d6b46a;font-size:14px;font-weight:bold}.numero{font-size:36px;margin:22px 0}.estado-actual{font-size:25px;color:#d6b46a;margin-bottom:16px}.descripcion{color:#bbb;font-size:15px;line-height:1.5}.separador{border:0;border-top:1px solid #514737;margin:35px 0}.paso{display:flex;align-items:center;gap:18px;margin-bottom:35px}.icono{width:56px;height:56px;flex-shrink:0;border-radius:50%;background:#292929;color:#aaa;display:flex;align-items:center;justify-content:center;font-size:25px}.icono svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.paso.activo .icono{background:#d6b46a;color:#101010}.nombre{font-size:20px;font-weight:bold;color:#999}.paso.activo .nombre{color:#d6b46a}
</style>
</head>
<body>
<div class="contenedor">
  <div class="logo"><h1>MUSIÚ</h1><div class="linea"></div><small>MÁS QUE PIZZA, UNA EXPERIENCIA</small></div>
  <div class="centro">
    <div class="subtitulo" id="subtitulo">SEGUIMIENTO DE TU EXPERIENCIA</div>
    <h1 class="numero" id="numero">MUSIÚ</h1>
    <h2 class="estado-actual" id="estadoActual">Consultando pedido...</h2>
    <p class="descripcion" id="descripcionActual">Espera un momento.</p>
  </div>
  <hr class="separador" id="separador" hidden>
  <div id="pasos"></div>
</div>
<script>
'use strict';
const iconos={
recibido:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4.5h6M9 3h6v3H9zM8.5 13l2.5 2.5 4.5-5"/>',
preparacion:'<path d="M4 11h16v5a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4v-5zM2 11h20M8 3c-2 2 2 3 0 5M13 3c-2 2 2 3 0 5M18 3c-2 2 2 3 0 5"/>',
listo:'<path d="M3 8l9-5 9 5v10l-9 5-9-5zM3 8l9 5 9-5M12 13v10M8 5.8l9 5"/><path d="M15 16l2 2 4-4"/>',
en_camino:'<circle cx="5.5" cy="18" r="2.5"/><circle cx="18.5" cy="18" r="2.5"/><path d="M8 18h4l2-6h4l2 3M12 18l-3-7H5M14 12l-2-3h-2M16 9h3l2 3"/>'
};
const estados=[
{clave:'recibido',titulo:'Pedido confirmado',descripcion:'¡Recibimos tu pedido! Pronto comenzaremos a prepararlo.'},
{clave:'preparacion',titulo:'Preparando tu pedido',descripcion:'Estamos preparando tu pedido con mucho cuidado.'},
{clave:'listo',titulo:'Pedido listo para entregar',descripcion:'¡Tu pedido está listo para salir!'},
{clave:'en_camino',titulo:'Tu pedido va en camino',descripcion:'¡Ya salió de MUSIÚ y va rumbo a ti!'}
];
const SUPABASE_URL='https://zvruieqqzknljoylrhjp.supabase.co';
const SUPABASE_KEY='sb_publishable_zRoz-osrAzL8khVnatcbKw_Zrcz5Tw7';
const codigo=new URLSearchParams(location.search).get('codigo');
let consultando=false;
let caducado=false;
function mostrarCaducado(){
  caducado=true;
  document.title='404 | Página no disponible | MUSIÚ';
  document.getElementById('subtitulo').textContent='SEGUIMIENTO FINALIZADO';
  document.getElementById('numero').textContent='404';
  document.getElementById('estadoActual').textContent='Página no disponible';
  document.getElementById('descripcionActual').textContent='Este enlace de seguimiento ha caducado o ya no existe.';
  document.getElementById('pasos').replaceChildren();
  document.getElementById('separador').hidden=true;
}
function mostrarErrorTemporal(){
  document.getElementById('estadoActual').textContent='No pudimos consultar tu pedido';
  document.getElementById('descripcionActual').textContent='Comprueba tu conexión e inténtalo de nuevo en unos segundos.';
  document.getElementById('pasos').replaceChildren();
  document.getElementById('separador').hidden=true;
}
function mostrarSeguimiento(pedido){
  const indice=estados.findIndex(e=>e.clave===pedido.estado);
  if(indice<0){mostrarCaducado();return;}
  document.title='Seguimiento de tu pedido | MUSIÚ';
  document.getElementById('numero').textContent=`Pedido #${pedido.numero_pedido}`;
  document.getElementById('estadoActual').textContent=estados[indice].titulo;
  document.getElementById('descripcionActual').textContent=estados[indice].descripcion;
  document.getElementById('separador').hidden=false;
  const contenedor=document.getElementById('pasos');contenedor.replaceChildren();
  estados.forEach((paso,i)=>{
    const fila=document.createElement('div');fila.className='paso'+(i<=indice?' activo':'');
    const icono=document.createElement('div');icono.className='icono';
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('aria-hidden','true');
    svg.innerHTML=iconos[paso.clave];icono.appendChild(svg);
    const nombre=document.createElement('div');nombre.className='nombre';nombre.textContent=paso.titulo;
    fila.append(icono,nombre);contenedor.appendChild(fila);
  });
}
async function consultarPedido(){
  if(caducado||consultando)return;
  if(!codigo){mostrarCaducado();return;}
  consultando=true;
  try{
    const respuesta=await fetch(`${SUPABASE_URL}/rest/v1/rpc/consultar_seguimiento_cliente`,{
      method:'POST',cache:'no-store',
      headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Cache-Control':'no-cache'},
      body:JSON.stringify({p_codigo:codigo})
    });
    if(!respuesta.ok)throw new Error(`HTTP ${respuesta.status}`);
    const datos=await respuesta.json();
    if(!Array.isArray(datos)||datos.length===0){mostrarCaducado();return;}
    const pedido=datos[0];
    if(['entregado','cancelado'].includes(pedido.estado)){mostrarCaducado();return;}
    mostrarSeguimiento(pedido);
  }catch(error){console.error('Error consultando seguimiento:',error);mostrarErrorTemporal();}
  finally{consultando=false;}
}
consultarPedido();
setInterval(consultarPedido,3000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)consultarPedido();});
</script>
</body>
</html>
